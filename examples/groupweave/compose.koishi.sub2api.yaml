# Linux deployment: an existing OpenShell 0.1.3 Docker gateway uses native mTLS
# on host loopback. Prepare its server/driver config and client bundle first.
# Include after compose.yaml and compose.koishi.yaml. Gateway lifecycle stays external.
services:
  groupweave:
    build:
      args:
        ENABLE_OPENSHELL_CLIENT: "1"
    network_mode: host
    ports: !reset []
    environment:
      HOST: "127.0.0.1"
      PORT: "${GROUPWEAVE_PORT:-4318}"
      ENABLE_AI: "1"
      SANDBOX_AI_BINDING_MODULE: /app/integrations/sub2api-openshell/deployment.mjs
      GROUPWEAVE_MODEL_CONFIG: /run/groupweave/provider.json
    volumes:
      - type: bind
        source: "${OPENSHELL_CLI_PATH:?Set the reviewed Linux OpenShell 0.1.3 CLI path}"
        target: /opt/openshell
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${GROUPWEAVE_MODEL_CONFIG_PATH:?Set the private deployment JSON path}"
        target: /run/groupweave/provider.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${OPENSHELL_CLIENT_BUNDLE_PATH:?Set the protected native mTLS client bundle directory}"
        target: /run/groupweave/openshell
        read_only: true
        bind:
          create_host_path: false
