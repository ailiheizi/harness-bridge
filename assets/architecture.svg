<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Harness Bridge architecture: host authority, thin bridge, isolated agent execution</title>
  <desc id="desc">A host application owns identity, permissions, storage and delivery. The implemented Harness Bridge uses the native OpenShell CLI to run existing DSH in a fresh Docker sandbox. OpenShell's trusted supervision is separate from the agent workload. External model and API access requires deployment policy; business APIs additionally enforce their own authorization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#376f7b" stroke-width="1.8"/></marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#97c8c9" stroke-width="1.8"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#193747}
      .eyebrow{font-size:19px;font-weight:700;letter-spacing:2px}
      .heading{font-size:28px;font-weight:700}
      .label{font-size:23px;font-weight:700}
      .body{font-size:22px;fill:#4a6472}
      .small{font-size:19px;fill:#526d78}
      .white{fill:#fff}
      .muted-light{fill:#c2d7df}
      .line{fill:none;stroke:#376f7b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1040" rx="24" fill="#f7faf9"/>
  <rect x="48" y="43" width="7" height="69" rx="3" fill="#27877e"/>
  <text x="77" y="75" font-size="38" font-weight="700">Harness Bridge</text>
  <text x="79" y="113" font-size="24" fill="#526d78">Compose capabilities. Isolate agent execution.</text>
  <rect x="1280" y="50" width="270" height="43" rx="21" fill="#e6eeeb"/>
  <text x="1415" y="78" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.5">SOURCE PREVIEW · 0.1</text>

  <!-- Host responsibilities are supplied by the integrating application. -->
  <rect x="48" y="174" width="420" height="590" rx="22" fill="#fffdf6" stroke="#b5a57f" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="76" y="211" class="eyebrow" fill="#8a7141">HOST APPLICATION</text>
  <text x="76" y="248" class="heading">Your app owns authority</text>
  <rect x="76" y="278" width="364" height="80" rx="12" fill="#f1eee2"/>
  <text x="98" y="312" class="label">Bot · API · event receiver</text>
  <text x="98" y="341" class="small">External timers use the same entry</text>
  <text x="98" y="406" class="label">Identity &amp; current permissions</text>
  <text x="98" y="439" class="body">Trusted task / tenant / actor</text>
  <line x1="98" y1="467" x2="418" y2="467" stroke="#ded8c4"/>
  <text x="98" y="506" class="label">Existing code &amp; storage</text>
  <text x="98" y="539" class="body">Approved deterministic fast path</text>
  <text x="98" y="572" class="body">Data, row &amp; field authorization</text>
  <rect x="76" y="619" width="364" height="116" rx="12" fill="#eee9d9"/>
  <text x="98" y="655" class="label">Result release &amp; delivery</text>
  <text x="98" y="689" class="body">Audience · accounting · persistence</text>
  <text x="98" y="717" class="small">Recheck before external effects</text>

  <!-- The implementation is a library inside the trusted app, not a new server. -->
  <rect x="540" y="174" width="390" height="590" rx="22" fill="#173a4b"/>
  <text x="570" y="211" class="eyebrow muted-light">IMPLEMENTED LIBRARY</text>
  <text x="570" y="248" class="heading white">Harness Bridge</text>
  <text x="570" y="282" class="small muted-light">Runs in the trusted app process</text>
  <line x1="570" y1="308" x2="900" y2="308" stroke="#3b5867"/>
  <text x="570" y="348" class="label white">01  Admit</text>
  <text x="570" y="382" class="body muted-light">Host authorization callbacks</text>
  <text x="570" y="433" class="label white">02  Bind &amp; execute</text>
  <text x="570" y="467" class="body muted-light">Fresh instance · exact identity</text>
  <text x="570" y="518" class="label white">03  Observe</text>
  <text x="570" y="552" class="body muted-light">DSH output &amp; session evidence</text>
  <text x="570" y="603" class="label white">04  Clean up &amp; gate result</text>
  <text x="570" y="637" class="body muted-light">Stop / delete · confirm absence</text>
  <rect x="570" y="675" width="330" height="58" rx="9" fill="#294d5e"/>
  <text x="735" y="712" text-anchor="middle" class="small white">Cancellation + bounded deadlines</text>

  <!-- Upstream trusted supervisor and untrusted workload are distinct. -->
  <rect x="1002" y="174" width="550" height="590" rx="22" fill="#eef7f4" stroke="#72a89c" stroke-width="2"/>
  <text x="1032" y="211" class="eyebrow" fill="#31776c">UPSTREAM · DOCKER ONLY</text>
  <text x="1032" y="248" class="heading">OpenShell-managed sandbox</text>
  <rect x="1032" y="278" width="490" height="118" rx="12" fill="#dbece5"/>
  <text x="1056" y="314" class="label">Trusted control &amp; supervision</text>
  <text x="1056" y="348" class="body">Native lifecycle · policy enforcement</text>
  <text x="1056" y="379" class="body">Approved egress · native credentials</text>
  <path d="M1277 398V431" class="line"/>
  <rect x="1032" y="443" width="490" height="290" rx="14" fill="#fff" stroke="#ce9d91" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1056" y="479" class="eyebrow" fill="#9b6658">FRESH TASK WORKLOAD</text>
  <text x="1056" y="524" class="heading">Existing DSH Harness</text>
  <text x="1056" y="565" class="body">Ordinary Skill (optional) + prompt</text>
  <text x="1056" y="599" class="body">Tools · generated code · workspace</text>
  <line x1="1056" y1="624" x2="1498" y2="624" stroke="#e8d7d2"/>
  <text x="1056" y="659" class="small">No host HOME, data or Docker socket mounts*</text>
  <text x="1056" y="691" class="small">New task → fresh sandbox; no reuse pool</text>

  <!-- Data and native lifecycle use existing APIs, never an agent authority claim. -->
  <path d="M468 405H533" class="line"/>
  <text x="504" y="384" text-anchor="middle" font-size="17" fill="#526d78">task</text>
  <path d="M930 337H995" class="line"/>
  <text x="963" y="317" text-anchor="middle" font-size="17" fill="#526d78">CLI</text>
  <path d="M1002 603H937" class="line"/>
  <text x="970" y="634" text-anchor="middle" font-size="17" fill="#526d78">result</text>
  <path d="M540 677H475" class="line"/>
  <text x="507" y="655" text-anchor="middle" font-size="17" fill="#526d78">gated</text>

  <rect x="48" y="804" width="882" height="102" rx="16" fill="#edf1f3"/>
  <text x="76" y="841" class="label">Host permissions and sandbox isolation work together.</text>
  <text x="76" y="875" class="body">Agent text cannot grant authority. A completed turn is not delivery proof.</text>
  <rect x="1002" y="804" width="550" height="102" rx="16" fill="#fff" stroke="#a2b8b4" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1032" y="841" class="label">External model / approved APIs</text>
  <text x="1032" y="875" class="body">Business APIs enforce their own data access.</text>
  <path d="M1522 337H1575V855H1559" class="line"/>
  <rect x="1558" y="547" width="34" height="155" rx="8" fill="#f7faf9"/>
  <text x="1580" y="624" text-anchor="middle" font-size="16" fill="#526d78" transform="rotate(90 1580 624)">policy-approved only</text>

  <line x1="48" y1="939" x2="1552" y2="939" stroke="#d9e2df"/>
  <text x="48" y="976" class="small">Solid: implemented binding or reused upstream. Dashed: host-provided responsibilities / agent boundary.</text>
  <text x="48" y="1008" class="small">*Deployment requirement. Verify policy and mounts on your target; shared-kernel Docker isolation is not a VM guarantee.</text>
</svg>
